spring:
  application:
    name: pet-adoption-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pet_adoption}
    username: ${DB_USERNAME:petuser}
    password: ${DB_PASSWORD:petpass}

  jpa:
    hibernate:
      # The schema belongs to Flyway. "validate" makes Hibernate check at boot
      # that the entities match the database -- drift fails fast instead of
      # turning into an obscure runtime error.
      ddl-auto: validate
    # Off on purpose: with open-in-view the session stays open during response
    # serialisation, hiding lazy loading behind N+1 queries.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

# No default on purpose: without JWT_SECRET in the environment the application
# does not start. Failing at boot with a clear message beats coming up and
# signing tokens with an example secret someone forgot to change.
app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      ttl: PT4H

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    org.flywaydb: info
