name: pet-adoption

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pet_adoption}
      POSTGRES_USER: ${DB_USER:-petuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-petpass}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ expects the volume at the root of /var/lib/postgresql, not
      # at /var/lib/postgresql/data as in earlier versions: the image now keeps
      # data in a per-major-version subfolder, which is what makes a future
      # "pg_upgrade" possible. Mounting the old path makes the container abort.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # The API waits on this healthcheck for real, not on an arbitrary "sleep":
      # Postgres only accepts connections once initdb has finished.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-petuser} -d ${DB_NAME:-pet_adoption}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Comes up with the sample database populated, so the project is
      # explorable immediately. Use SPRING_PROFILES_ACTIVE=default for an
      # empty database.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-pet_adoption}
      DB_USERNAME: ${DB_USER:-petuser}
      DB_PASSWORD: ${DB_PASSWORD:-petpass}
      # A development value. In any real environment, set JWT_SECRET in the
      # environment: this default exists only so compose comes up without
      # ceremony.
      JWT_SECRET: ${JWT_SECRET:-local-development-change-this-secret-now}
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  pgdata:
